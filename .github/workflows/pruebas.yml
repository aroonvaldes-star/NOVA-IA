# Prueba NOVA en Windows de verdad: las pruebas de Python y que los scripts de PowerShell se lean bien.
name: Pruebas en Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scripts de PowerShell (sin errores de sintaxis, solo ASCII)
        shell: powershell
        run: |
          $mal = 0
          foreach ($f in Get-ChildItem -Filter *.ps1) {
            $errores = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errores)
            foreach ($e in $errores) { Write-Host "$($f.Name):$($e.Extent.StartLineNumber): $($e.Message)"; $mal++ }
            if ([IO.File]::ReadAllBytes($f.FullName) | Where-Object { $_ -gt 127 }) { Write-Host "$($f.Name): tiene caracteres que no son ASCII"; $mal++ }
          }
          if ($mal) { exit 1 }
          Write-Host 'Scripts bien.'
      - name: Funciones del instalador (orbe de escritorio y accesos)
        shell: powershell
        run: |
          . .\escritorio.ps1
          $datos = Join-Path $env:RUNNER_TEMP 'NOVA'
          New-Item -ItemType Directory -Force $datos | Out-Null
          $exe = Obtener-Escritorio (Get-Location).Path $datos
          Write-Host "Orbe de escritorio: $exe"
          if (-not $exe) { Write-Host 'Sin la rama escritorio en este checkout (normal en pruebas)'; }
          else { if ((Get-Item $exe).Length -lt 1000000) { throw 'El .exe bajado esta incompleto' } }
      - name: Pruebas de Python
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -q -e ".[completo]" pytest
          python -m pytest -q -rfE --tb=line 2>&1 | Tee-Object -FilePath salida.txt
          $codigo = $LASTEXITCODE
          # Cada falla como anotación: así se ve en el resumen sin bajar el registro completo.
          Get-Content salida.txt | Where-Object { $_ -match '^(FAILED|ERROR) |\.py:\d+: ' } | Select-Object -First 40 |
            ForEach-Object { Write-Host "::error::$($_ -replace '[\r\n]', ' ')" }
          exit $codigo

  omniroute:
    # Instala OmniRoute como lo haria actualizar.bat en una PC nueva que ya usaba Groq, y revisa que quede seguro.
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar OmniRoute con omniroute.ps1
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force "$env:APPDATA\NOVA" | Out-Null
          '{"cerebro_endpoint":"https://api.groq.com/openai/v1","cerebro_clave":"gsk_prueba_falsa_0123456789abcdef","cerebro_auto":false,"internet":true}' |
            Set-Content -Encoding ascii "$env:APPDATA\NOVA\config.json"
          # En otro proceso con limite de tiempo: si se cuelga, igual se ve en que paso iba.
          $p = Start-Process powershell -ArgumentList '-NoProfile -ExecutionPolicy Bypass -Command "& .\omniroute.ps1 -SinPreguntas *>&1 | Out-File -Encoding utf8 salida.txt; exit $LASTEXITCODE"' -PassThru -NoNewWindow
          $termino = $p.WaitForExit(1500 * 1000)
          if (Test-Path salida.txt) { Get-Content salida.txt | Where-Object { $_.Trim() } | Select-Object -Last 40 | ForEach-Object { Write-Host "::notice::$($_ -replace '[\r\n]', ' ')" } }
          foreach ($f in "$env:LOCALAPPDATA\NOVA\estado\omniroute.log", "$env:LOCALAPPDATA\NOVA\estado\omniroute-errores.log") {
            if (Test-Path $f) { Get-Content $f -Tail 12 | ForEach-Object { Write-Host "::notice::$(Split-Path $f -Leaf): $($_ -replace '[\r\n]', ' ')" } }
          }
          if (-not $termino) { Write-Host '::error::omniroute.ps1 no termino en 25 minutos'; Get-Process node, npm -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "::error::sigue vivo: $($_.Name) $($_.Id)" }; exit 1 }
          if ((Get-Content salida.txt -Raw) -match 'Listo\. Panel de OmniRoute') { exit 0 }
          Write-Host '::error::omniroute.ps1 fallo (ver avisos)'; exit 1
      - name: Revisar que quede seguro y conectado a NOVA
        shell: powershell
        run: |
          $mal = 0
          function Falla($t) { Write-Host "::error::$t"; $script:mal++ }
          $c = Get-Content "$env:APPDATA\NOVA\config.json" -Raw | ConvertFrom-Json
          if ($c.cerebro_endpoint -ne 'http://127.0.0.1:20128/v1') { Falla "cerebro_endpoint quedo en $($c.cerebro_endpoint)" }
          if ($c.cerebro_api_modelo -ne 'auto') { Falla "cerebro_api_modelo quedo en $($c.cerebro_api_modelo)" }
          if (-not (Test-Path "$env:APPDATA\NOVA\config.json.antes-omniroute")) { Falla 'No guardo la config anterior' }
          Write-Host "::notice::NOVA tiene clave de OmniRoute: $([bool]$c.cerebro_clave)"
          $escucha = Get-NetTCPConnection -LocalPort 20128 -State Listen -ErrorAction SilentlyContinue
          Write-Host "::notice::Escucha en: $(($escucha | ForEach-Object LocalAddress) -join ', ')"
          if (-not $escucha) { Falla 'OmniRoute no quedo escuchando' }
          if ($escucha | Where-Object { $_.LocalAddress -notin '127.0.0.1', '::1' }) { Falla 'OmniRoute escucha fuera de esta PC' }
          function Pedir($ruta, $clave, $cuerpo) {
            $h = @{}; if ($clave) { $h['Authorization'] = "Bearer $clave" }
            try {
              if ($cuerpo) { $r = Invoke-WebRequest "http://127.0.0.1:20128$ruta" -Method Post -Headers $h -Body $cuerpo -ContentType 'application/json' -UseBasicParsing -TimeoutSec 60 }
              else { $r = Invoke-WebRequest "http://127.0.0.1:20128$ruta" -Headers $h -UseBasicParsing -TimeoutSec 60 }
              return @{ Codigo = [int]$r.StatusCode; Texto = $r.Content }
            } catch {
              $resp = $_.Exception.Response
              $texto = ''
              if ($resp) { try { $texto = (New-Object IO.StreamReader($resp.GetResponseStream())).ReadToEnd() } catch {} ; return @{ Codigo = [int]$resp.StatusCode; Texto = $texto } }
              return @{ Codigo = 0; Texto = $_.Exception.Message }
            }
          }
          $sin = Pedir '/v1/models' $null $null
          $con = Pedir '/v1/models' $c.cerebro_clave $null
          Write-Host "::notice::/v1/models sin clave: $($sin.Codigo); con la clave de NOVA: $($con.Codigo)"
          if ($c.cerebro_clave -and $sin.Codigo -eq 200) { Falla 'OmniRoute contesta sin clave aunque NOVA tiene una' }
          if ($con.Codigo -ne 200) { Falla "Con la clave de NOVA /v1/models dio $($con.Codigo): $($con.Texto.Substring(0, [Math]::Min(200, $con.Texto.Length)))" }
          $chat = Pedir '/v1/chat/completions' $c.cerebro_clave '{"model":"auto","messages":[{"role":"user","content":"hola"}],"max_tokens":5}'
          $t = ($chat.Texto -replace '[\r\n]', ' ')
          Write-Host "::notice::chat auto con clave de Groq falsa: $($chat.Codigo) $($t.Substring(0, [Math]::Min(300, $t.Length)))"
          if ($mal) { exit 1 }
      - name: NOVA lo vuelve a prender sola
        shell: pwsh
        run: |
          Get-Process node -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 3
          python -m pip install --disable-pip-version-check -q -e .
          python -c "from nova import omniroute; from nova.config import cargar; c = cargar(); print(omniroute.arrancar(c))"
          for ($i = 0; $i -lt 120; $i++) { if (Get-NetTCPConnection -LocalPort 20128 -State Listen -ErrorAction SilentlyContinue) { break }; Start-Sleep 1 }
          $escucha = Get-NetTCPConnection -LocalPort 20128 -State Listen -ErrorAction SilentlyContinue
          if (-not $escucha) {
            Get-Content "$env:LOCALAPPDATA\NOVA\estado\omniroute.log" -Tail 20 -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "::error::$_" }
            Write-Host '::error::NOVA no pudo prender OmniRoute'; exit 1
          }
          Write-Host "::notice::NOVA lo prendio en $(($escucha | ForEach-Object LocalAddress) -join ', ') tras $i s"
          python -m nova diagnostico 2>&1 | Select-String -Pattern 'OmniRoute|Cerebro|cerebro' | ForEach-Object { Write-Host "::notice::$($_.Line.Trim())" }
