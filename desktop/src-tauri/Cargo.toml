[package]
name = "nova-escritorio"
version = "0.1.0"
description = "Envoltorio de escritorio de NOVA: el orbe flotante, la bandeja y los atajos globales"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Sin la CLI de Tauri, la compilación final necesita esto para usar la interfaz empaquetada.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
