<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="nova-token" content="{{NOVA_TOKEN}}">
<title>NOVA</title>
<link rel="stylesheet" href="estilo.css">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icono.svg" type="image/svg+xml">
<meta name="theme-color" content="#05070f">
<script type="module" src="app.js"></script>
</head>
<body class="{{NOVA_MODO}}">
<div id="halo" hidden></div>
<canvas id="orbe" aria-label="NOVA"></canvas>

<button id="toque" class="flotante" type="button" title="Escríbeme (Ctrl+Alt+A) · Mantén Ctrl+Alt+Espacio para hablarme" aria-label="Escribirle a NOVA" hidden></button>
<div id="indicadores" class="flotante">
  <span id="ind-internet" hidden>🌐 internet</span>
  <span id="ind-pantalla" hidden>👁 viendo tu pantalla</span>
  <span id="ind-privado" hidden>modo privado</span>
  <span id="ind-escucha" hidden><i class="punto"></i> escuchando</span>
  <span id="ind-offline" hidden>sin conexión</span>
</div>

<main id="charla" class="interactivo">
  <div id="conversacion" role="log" aria-live="polite" aria-label="Conversación con NOVA"></div>
  <form id="entrada" autocomplete="off">
    <button type="button" id="microfono" title="Mantén presionado para hablar">🎙</button>
    <input id="texto" type="text" placeholder="Háblame o escribe… (Esc para esconder)" spellcheck="true">
    <button type="submit" id="enviar" title="Enviar">➤</button>
  </form>
</main>

<template id="plantilla-confirmacion">
  <div class="msg confirmar">
    <p class="aviso">Necesito tu confirmación</p>
    <pre class="descripcion"></pre>
    <p class="codigo-linea">Código <b class="codigo"></b> <small class="solo-clic" hidden>(solo con clic o teclado)</small></p>
    <p class="botones"><button class="si">Confirmar</button><button class="no">Cancelar</button></p>
  </div>
</template>
</body>
</html>
